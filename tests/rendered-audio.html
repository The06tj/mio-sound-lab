<!doctype html><html lang="en"><meta charset="utf-8"><title>Mio Sound Lab — Audio verification</title><style>body{background:#11151a;color:#d7fc70;font:16px monospace;padding:30px}button{font:inherit;padding:15px}pre{white-space:pre-wrap;line-height:1.7}</style><h1>Rendered Web Audio checks</h1><p>Uses the same createVoice graph as the live app. Silent offline rendering.</p><button id="run">Run audio checks</button><pre id="results">Ready.</pre><script type="module">
import {createVoice} from '../dist/audio.js';
const output=document.querySelector('#results');
function rms(data,start=24000){let sum=0;for(let i=start;i<data.length;i++)sum+=data[i]*data[i];return Math.sqrt(sum/(data.length-start));}
async function render(index,value,mode,sampleRate=48000){const c=new OfflineAudioContext(2,sampleRate,sampleRate);createVoice(c,index,{value,mode},c.destination);return c.startRendering();}
function difference(a,b,scale=1){return Float32Array.from(a,(x,i)=>x-b[i]*scale);}
const logs=[];function check(name,pass,detail){logs.push(`${pass?'PASS':'FAIL'} ${name}: ${detail}`);output.textContent=logs.join('\n');if(!pass)throw Error(name);}
document.querySelector('#run').onclick=async()=>{logs.length=0;output.textContent='Running…';try{
for(const sr of [44100,48000]){const zero=await render(0,0,'sum',sr),half=await render(0,180,'sum',sr),quarter=await render(0,90,'sum',sr),full=await render(0,360,'sum',sr),solo=await render(0,180,'solo',sr);const base=rms(zero.getChannelData(0));check(`Phase baseline ${sr}`,base>.70&&base<.72,base.toFixed(6));check(`180° null ${sr}`,rms(half.getChannelData(0))<1e-6,rms(half.getChannelData(0)).toExponential(2));check(`90° amplitude ${sr}`,Math.abs(rms(quarter.getChannelData(0))/base-Math.SQRT1_2)<.003,(rms(quarter.getChannelData(0))/base).toFixed(6));check(`360° return ${sr}`,rms(difference(full.getChannelData(0),zero.getChannelData(0)))<1e-5,'waveform matches');check(`A-only bypass ${sr}`,rms(difference(solo.getChannelData(0),zero.getChannelData(0)))<1e-5,'reference matches');}
const dry=await render(1,0,'dry'),noDelay=await render(1,0,'mix'),comb=await render(1,2,'mix');check('Zero-delay sum = dry',rms(difference(dry.getChannelData(0),noDelay.getChannelData(0)))<1e-5,'identical');const data=dry.getChannelData(0),mixed=comb.getChannelData(0);let residual=0;for(let i=24000;i<data.length;i++){const expected=.5*(data[i]+data[i-96]);residual+=(mixed[i]-expected)**2;}residual=Math.sqrt(residual/24000);check('2 ms comb matches delayed-signal oracle',residual<1e-5,residual.toExponential(3));
const stereo=await render(2,100,'stereo'),mono=await render(2,100,'mono'),center=await render(2,0,'stereo');const l=stereo.getChannelData(0),r=stereo.getChannelData(1),ml=mono.getChannelData(0),mr=mono.getChannelData(1);check('Stereo has real channel difference',rms(difference(l,r))>.05,rms(difference(l,r)).toFixed(5));check('Mono channels identical',rms(difference(ml,mr))<1e-7,'L = R');const folded=Float32Array.from(l,(v,i)=>(v+r[i])/2);check('Mono equals actual L/R fold',rms(difference(folded,ml))<1e-5,rms(difference(folded,ml)).toExponential(2));check('Center survives unchanged',rms(difference(ml,center.getChannelData(0)))<1e-5,'same Mid');let peak=0;for(const value of l)peak=Math.max(peak,Math.abs(value));check('Stereo headroom',peak<1,peak.toFixed(5));output.textContent+='\nALL 17 CHECKS PASSED';document.body.dataset.result='pass';}catch(e){output.textContent+='\nERROR '+e.message;document.body.dataset.result='fail';}};
</script></html>
