<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive QA · Mio Sound Lab</title><style>body{background:#252c36;color:white;font:16px sans-serif;padding:16px}iframe{display:block;width:390px;height:844px;border:0}button{font:inherit;padding:10px;margin:10px}</style><h1>Responsive QA</h1><button id="phone">390 px phone</button><button id="small">320 px narrow phone</button><button id="text">Toggle 200% text</button><p id="result"></p><iframe title="Sound Lab phone preview" src="../dist/"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#phone').onclick=()=>{frame.style.width='390px';};document.querySelector('#small').onclick=()=>{frame.style.width='320px';};document.querySelector('#text').onclick=()=>{const root=frame.contentDocument.documentElement;root.style.fontSize=root.style.fontSize==='32px'?'16px':'32px';};setInterval(()=>{const doc=frame.contentDocument;document.querySelector('#result').textContent=`Viewport ${doc.documentElement.clientWidth}px / content ${doc.documentElement.scrollWidth}px`;},500);</script></html>
